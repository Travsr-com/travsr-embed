name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every branch push used to also arrive as a pull_request event, so each commit
# on a PR ran the whole workflow twice and nothing cancelled the superseded
# runs. Mirrors travsr's own ci.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read the repo (plus the public travsr sibling). Nothing here
# needs a write token, and `cargo check` runs third-party build scripts and
# proc macros, so hand it the narrowest one available.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - uses: actions/checkout@v4

      # travsr sibling repo required for [patch.crates-io] path deps.
      # actions/checkout@v4 requires path to be inside $GITHUB_WORKSPACE, so
      # we check out into _travsr (inside workspace) then symlink ../travsr so
      # Cargo's `path = "../travsr/crates/..."` patches resolve correctly.
      - uses: actions/checkout@v4
        id: checkout_travsr
        with:
          repository: Travsr-com/travsr
          path: _travsr
          ref: master

      - name: Symlink travsr sibling for Cargo patch paths
        run: ln -sfn "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"

      - name: Install Rust (stable + MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # `Cargo.lock`, not `**/Cargo.lock`: the sibling travsr checkout lives
          # inside the workspace by this point, so the recursive glob folded its
          # lockfile into the key and any travsr master commit touching deps
          # this repo does not even use threw away the whole target/ cache.
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # L7: this repo path-depends on travsr-plugin-{protocol,sdk} from the
      # sibling checked out above. When a paired travsr-side protocol change
      # hasn't landed on master yet, the failure here is an unresolved-import
      # error deep in fmt/clippy/test with no hint about why - #376 §22.2 cost
      # a full debugging cycle finding that out. Fail fast with the answer.
      - name: Preflight — compile against travsr master
        id: preflight
        continue-on-error: true
        shell: bash
        run: cargo check --all-targets --quiet 2>&1 | tee "$RUNNER_TEMP/preflight.log"

      - name: Explain a preflight failure
        if: steps.preflight.outcome == 'failure'
        shell: bash
        env:
          TRAVSR_SHA: ${{ steps.checkout_travsr.outputs.commit }}
        run: |
          # The preflight step is `continue-on-error`, so the checks UI renders
          # it as passed and its output is a click away. Re-print it here, where
          # the failure actually is.
          echo "::group::cargo check output"
          cat "$RUNNER_TEMP/preflight.log" || true
          echo "::endgroup::"
          # Only claim the sibling-drift diagnosis when the errors actually look
          # like it. Most red CI is this repo's own code, and a confidently
          # wrong "go merge the other PR first" is worse than no hint at all.
          if grep -qE 'unresolved import|E0432|E0433|travsr_plugin_' "$RUNNER_TEMP/preflight.log"; then
            echo "::error::This repo path-depends on travsr-plugin-{protocol,sdk} from"
            echo "::error::Travsr-com/travsr@master (checked out above at $TRAVSR_SHA)."
            echo "::error::If this PR needs a travsr-side change, that change must be"
            echo "::error::merged to travsr master FIRST. Unresolved-import errors here"
            echo "::error::usually mean the paired travsr PR is still open."
          else
            echo "::error::Preflight failed to compile, and the errors do not look like"
            echo "::error::travsr-sibling drift (compiled against travsr@master $TRAVSR_SHA)."
            echo "::error::Treat this as a compile error in this repo's own code - see the"
            echo "::error::'cargo check output' group above."
          fi
          exit 1

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

  # Issue #12: release.yml publishes a x86_64-pc-windows-msvc binary, so prove
  # the MSVC build compiles and links on every PR instead of discovering
  # breakage at tag time. Build-only: the test suite stays on the ci matrix
  # above. Uses release.yml's sibling-checkout + sed rewrite instead of the ci
  # job's symlink, which Windows runners can't create.
  windows-build:
    name: Windows build (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    env:
      # Mirrors release.yml (including its Windows-only extra_defs): skip the
      # one AVX512-FP16 simsimd kernel, and define the POSIX MAP_FAILED that
      # usearch 2.24.0 references in an unguarded template body — see the
      # release.yml matrix comment. cl.exe accepts the -D spelling.
      CFLAGS: "-DSIMSIMD_TARGET_SAPPHIRE=0 -DMAP_FAILED=((void*)-1)"
      CXXFLAGS: "-DSIMSIMD_TARGET_SAPPHIRE=0 -DMAP_FAILED=((void*)-1)"
      # esaxx-rs hardcodes static_crt(true); build everything /MT to match —
      # see the release.yml matrix comment.
      RUSTFLAGS: "-Ctarget-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Travsr-com/travsr
          path: travsr-sibling
          ref: master

      - name: Rewrite Cargo.toml patch paths for CI
        shell: bash
        run: sed -i.bak 's|path = "\.\./travsr/|path = "travsr-sibling/|g' Cargo.toml && rm -f Cargo.toml.bak

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (release, mirrors release.yml)
        run: cargo build --release --target x86_64-pc-windows-msvc

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Travsr-com/travsr
          path: _travsr
          ref: master
      - name: Symlink travsr sibling for Cargo patch paths
        run: ln -sfn "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"
      - uses: dtolnay/rust-toolchain@1.91

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-msrv-cargo-

      # L7: `build (MSRV)` below surfaces the same unresolved-import error the
      # ci job's preflight explains, so this job does not repeat the preflight -
      # a second copy of the identical ::error:: block in the checks UI is noise,
      # and on this (previously uncached) job it cost more than the build it
      # duplicated. The ci job owns the diagnosis.
      - name: build (MSRV)
        run: cargo build --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # travsr sibling repo required for [patch.crates-io] path deps - see the
      # ci job's identical steps above. Unlike that job, this one can't use
      # EmbarkStudios/cargo-deny-action: it runs cargo-deny inside a Docker
      # container that bind-mounts only $GITHUB_WORKSPACE, so a symlink
      # pointing outside the workspace (../travsr) resolves to nothing in
      # there. Installing cargo-deny and running it directly on the runner
      # keeps it in the same filesystem view as the ci/msrv jobs.
      - uses: actions/checkout@v4
        id: checkout_travsr
        with:
          repository: Travsr-com/travsr
          path: _travsr
          ref: master

      - name: Symlink travsr sibling for Cargo patch paths
        run: ln -sfn "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      # deny.toml is deliberately kept in sync with travsr's own (see its
      # header comment) - a job that never runs cannot hold that invariant.
      - name: Check advisories, licenses, and bans
        run: cargo deny check advisories licenses bans sources
