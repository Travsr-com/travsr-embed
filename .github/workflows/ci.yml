name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]

    steps:
      - uses: actions/checkout@v4

      # travsr sibling repo required for [patch.crates-io] path deps.
      # actions/checkout@v4 requires path to be inside $GITHUB_WORKSPACE, so
      # we check out into _travsr (inside workspace) then symlink ../travsr so
      # Cargo's `path = "../travsr/crates/..."` patches resolve correctly.
      - uses: actions/checkout@v4
        id: checkout_travsr
        with:
          repository: Travsr-com/travsr
          path: _travsr
          ref: master

      - name: Symlink travsr sibling for Cargo patch paths
        run: ln -s "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"

      - name: Install Rust (stable + MSRV)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # L7: this repo path-depends on travsr-plugin-{protocol,sdk} from the
      # sibling checked out above. When a paired travsr-side protocol change
      # hasn't landed on master yet, the failure here is an unresolved-import
      # error deep in fmt/clippy/test with no hint about why - #376 §22.2 cost
      # a full debugging cycle finding that out. Fail fast with the answer.
      - name: Preflight — compile against travsr master
        id: preflight
        continue-on-error: true
        run: cargo check --all-targets --quiet

      - name: Explain a preflight failure
        if: steps.preflight.outcome == 'failure'
        env:
          TRAVSR_SHA: ${{ steps.checkout_travsr.outputs.commit }}
        run: |
          echo "::error::This repo path-depends on travsr-plugin-{protocol,sdk} from"
          echo "::error::Travsr-com/travsr@master (checked out above at $TRAVSR_SHA)."
          echo "::error::If this PR needs a travsr-side change, that change must be"
          echo "::error::merged to travsr master FIRST. Unresolved-import errors here"
          echo "::error::usually mean the paired travsr PR is still open."
          exit 1

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test --all-targets

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        id: checkout_travsr
        with:
          repository: Travsr-com/travsr
          path: _travsr
          ref: master
      - name: Symlink travsr sibling for Cargo patch paths
        run: ln -s "$GITHUB_WORKSPACE/_travsr" "$GITHUB_WORKSPACE/../travsr"
      - uses: dtolnay/rust-toolchain@1.91

      # L7: same preflight as the ci job above — see that job's comment.
      - name: Preflight — compile against travsr master
        id: preflight
        continue-on-error: true
        run: cargo check --all-targets --quiet

      - name: Explain a preflight failure
        if: steps.preflight.outcome == 'failure'
        env:
          TRAVSR_SHA: ${{ steps.checkout_travsr.outputs.commit }}
        run: |
          echo "::error::This repo path-depends on travsr-plugin-{protocol,sdk} from"
          echo "::error::Travsr-com/travsr@master (checked out above at $TRAVSR_SHA)."
          echo "::error::If this PR needs a travsr-side change, that change must be"
          echo "::error::merged to travsr master FIRST. Unresolved-import errors here"
          echo "::error::usually mean the paired travsr PR is still open."
          exit 1

      - name: build (MSRV)
        run: cargo build --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # deny.toml is deliberately kept in sync with travsr's own (see its
      # header comment) - a job that never runs cannot hold that invariant.
      - name: Check advisories, licenses, and bans
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
