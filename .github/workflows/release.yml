name: Release

on:
  push:
    tags: ["v*"]

env:
  # Must match the Cargo [[bin]] name and the asset name the travsr CLI expects
  # (embed_catalog.toml binary_name = "travsr-embed").
  BINARY: travsr-embed
  # usearch 2.24.0 / simsimd compiles an AVX512-FP16 (Sapphire Rapids) x86 kernel
  # that needs gcc 12+; the ubuntu-22.04 runners ship gcc 11. Disable that one
  # target. f16 math is already software-pathed (SIMSIMD_NATIVE_F16=0), so there
  # is no functional loss. Harmless on aarch64 / macOS (the macro is x86-only).
  CFLAGS: "-DSIMSIMD_TARGET_SAPPHIRE=0"
  CXXFLAGS: "-DSIMSIMD_TARGET_SAPPHIRE=0"

jobs:
  build:
    # Suffix in the name: two rows now share the x86_64-unknown-linux-gnu triple
    # (default and -cuda), and identical job names are unreadable in the checks UI.
    name: Build ${{ matrix.target }}${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `features`/`suffix` (issue #6): a row with no `features` builds the
        # tract-only default and stays byte-identical to previous releases. A row
        # with `suffix` publishes an ADDITIONAL asset under that suffix; the
        # unsuffixed asset for a target must keep its exact name, because the
        # travsr CLI derives it from the target triple.
        #
        # macOS gains CoreML in its DEFAULT asset (no suffix) because ort's macOS
        # prebuilt bundles CoreML statically: zero extra install, no dylibs to
        # ship, no host prerequisite. That is not true of any other accelerator,
        # which is why every other GPU build is a separate opt-in artifact.
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            features: ort-coreml
          # NO ort-coreml, unlike aarch64 above: ort publishes no prebuilt ONNX
          # Runtime for x86_64-apple-darwin at all, so any ort feature fails the
          # build with "ort does not provide prebuilt binaries for the target".
          # Intel Macs therefore ship the tract-only default. This is not a
          # choice, it is the whole of what upstream offers.
          #
          # ci.yml cannot catch a regression here: its macOS rows run on
          # macos-14, which is arm64, and build for the host, so ort-coreml is
          # only ever compiled for aarch64. This comment is the guard.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm   # native ARM64 runner - avoids cross Docker image gcc version limits
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # NVIDIA on Linux. Separate asset, not the default: CUDA/cuDNN must be
          # present on the HOST, so a default-shipped CUDA build would break every
          # GPU-less machine. $ORIGIN rpath so the bundled provider .so files
          # resolve from beside the binary rather than a system path.
          #
          # ubuntu-24.04, unlike every other Linux row: ort's prebuilt ONNX Runtime
          # references `__isoc23_strtol` and friends, which glibc only exports from
          # 2.38. The 22.04 runner ships 2.35, so this row failed to LINK there —
          # and only at tag time, because ci.yml's ort-cuda-link check already ran
          # on 24.04. Exactly the CI-versus-release gap this PR closes elsewhere.
          # Keep this runner and ci.yml's in step; the default rows stay on 22.04
          # deliberately, since a lower glibc floor is a feature for a CPU binary.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            features: ort-cuda
            suffix: "-cuda"
            # Not spelled as a rustflags string: the Build step interpolates
            # matrix values inside a double-quoted bash assignment, where a
            # literal $ORIGIN would be expanded by the shell to the empty string
            # and produce a binary with no rpath at all — which then fails only at
            # run time on a user's machine. The flag is assembled with explicit
            # escaping in the Build step instead.
            rpath_origin: true
          # Issue #12: the travsr CLI maps windows/x86_64 to this triple and
          # requests `<binary>-<target>.exe`; without this entry `travsr embed
          # init` 404s on Windows.
          #
          # extra_defs: usearch 2.24.0 references the POSIX MAP_FAILED in an
          # unguarded template body (index_plugins.hpp:962, fixed upstream
          # after 2.24.0; 2.25+ is blocked by the gcc-12 pin above), and the
          # usearch build script passes /permissive- so MSVC rejects it.
          # Supply the POSIX value: the Windows allocation paths return
          # VirtualAlloc/NULL, never -1, so the comparison is inert. Windows-
          # only — on unix sys/mman.h already defines it and a command-line
          # copy would be a redefinition.
          #
          # rustflags: esaxx-rs (via tokenizers) hardcodes static_crt(true) in
          # its build.rs, so its objects are /MT while Rust's msvc default is
          # /MD — LNK2038 RuntimeLibrary mismatch. Build everything with the
          # static CRT instead; that also frees end users from needing the
          # VC++ redistributable for a downloaded sidecar binary.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            extra_defs: "-DMAP_FAILED=((void*)-1)"
            rustflags: "-Ctarget-feature=+crt-static"
          # Windows GPU, every vendor. NOT a `-cuda` row: ort's CUDA prebuilt for
          # this triple wants the dynamic CRT while the rustflags above force /MT,
          # so it fails to link (59 LNK2019s on `__imp_*`) — as do ALL statically
          # linked ort features, CPU-only included. ci.yml keeps probing them.
          #
          # This row sidesteps that instead of fighting it: `ort-directml` uses
          # ort's load-dynamic, linking no ONNX Runtime at build time and loading
          # onnxruntime.dll at run time, so the two CRTs never have to agree. It
          # also frees us from ort's prebuilt set, which is what makes DirectML
          # reachable — and DirectML drives ANY DX12 adapter, so one artifact
          # serves Intel, AMD and NVIDIA rather than NVIDIA alone.
          #
          # No rpath needed: Windows searches the .exe's own directory first.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            extra_defs: "-DMAP_FAILED=((void*)-1)"
            rustflags: "-Ctarget-feature=+crt-static"
            features: ort-directml
            suffix: "-directml"
            # Bundle a DirectML-enabled ONNX Runtime beside the binary. Microsoft's
            # package, pinned by version AND sha256: this DLL is loaded into the
            # sidecar's own process, so an unverified download would be arbitrary
            # code execution on every user's machine. 1.24.2 matches the ONNX
            # Runtime that ort 2.0.0-rc.12 targets — keep them in step when either
            # moves, since a mismatched ORT API version fails at run time.
            ort_dll_pkg: microsoft.ml.onnxruntime.directml
            ort_dll_ver: "1.24.2"
            ort_dll_sha256: c9b8adb96dfb5578097bea42a7d9b7ff8f300fb3c3a6f3052fe5b702628ab681

    steps:
      - uses: actions/checkout@v4

      # travsr (sibling repo) is required for [patch.crates-io] path deps.
      # actions/checkout v4 requires the path to be inside the workspace root,
      # so we check out into travsr-sibling/ and rewrite the patch path in
      # Cargo.toml before building. This also works inside the cross Docker
      # container which only mounts the workspace, not its parent directory.
      - uses: actions/checkout@v4
        with:
          repository: Travsr-com/travsr
          path: travsr-sibling
          ref: master

      - name: Rewrite Cargo.toml patch paths for CI
        shell: bash
        # sed -i requires a backup suffix on BSD/macOS sed; .bak works on both GNU and BSD.
        run: sed -i.bak 's|path = "\.\./travsr/|path = "travsr-sibling/|g' Cargo.toml && rm -f Cargo.toml.bak

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # load-dynamic builds link no ONNX Runtime, so the artifact is useless
      # without the library beside it — and worse than useless if the library is
      # not the one we vetted, since it is loaded straight into the sidecar's
      # process. Hence: pinned version, checked sha256, and a hard failure rather
      # than any attempt to carry on with an unverified DLL.
      - name: Fetch and verify the DirectML ONNX Runtime
        if: matrix.ort_dll_pkg != ''
        shell: bash
        run: |
          set -euo pipefail
          pkg='${{ matrix.ort_dll_pkg }}'; ver='${{ matrix.ort_dll_ver }}'
          want='${{ matrix.ort_dll_sha256 }}'
          url="https://api.nuget.org/v3-flatcontainer/$pkg/$ver/$pkg.$ver.nupkg"
          echo "fetching $url"
          curl -fsSL --retry 3 -o pkg.nupkg "$url"

          got="$(sha256sum pkg.nupkg | awk '{print $1}')"
          if [ "$got" != "$want" ]; then
            echo "::error::sha256 mismatch for $pkg $ver — expected $want, got $got. Refusing to bundle an unverified ONNX Runtime."
            exit 1
          fi
          echo "sha256 verified: $got"

          # Only the native win-x64 payload; the package also carries managed
          # assemblies this sidecar has no use for.
          unzip -o -q pkg.nupkg 'runtimes/win-x64/native/*'
          mkdir -p ortlib
          cp runtimes/win-x64/native/onnxruntime.dll ortlib/
          # Present in the package and copied when it exists: ORT loads it for
          # out-of-tree providers. Not fatal if a future package drops it.
          cp runtimes/win-x64/native/onnxruntime_providers_shared.dll ortlib/ 2>/dev/null || true
          ls -la ortlib
          # DirectML.dll itself is a Windows system component (System32) from
          # Win10 1903 on, so it is deliberately NOT bundled.

      - name: Build
        shell: bash
        run: |
          export CFLAGS="$CFLAGS ${{ matrix.extra_defs }}" CXXFLAGS="$CXXFLAGS ${{ matrix.extra_defs }}"
          export RUSTFLAGS="$RUSTFLAGS ${{ matrix.rustflags }}"

          # \$ORIGIN, escaped: the linker must receive the literal string
          # "$ORIGIN" (it resolves it at load time to the binary's own directory),
          # so bash must NOT expand it here.
          if [ "${{ matrix.rpath_origin }}" = "true" ]; then
            export RUSTFLAGS="$RUSTFLAGS -C link-args=-Wl,-rpath,\$ORIGIN"
          fi

          FEATURES=""
          if [ -n "${{ matrix.features }}" ]; then FEATURES="--features ${{ matrix.features }}"; fi
          echo "building ${{ matrix.target }} ${FEATURES:-(default features)}"
          echo "RUSTFLAGS=$RUSTFLAGS"
          cargo build --release --target ${{ matrix.target }} $FEATURES

      - name: Bundle binary + ORT provider libraries
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          OUTDIR="dist"
          mkdir -p "$OUTDIR"

          # Windows assets keep the .exe extension: asset is
          # `travsr-embed-x86_64-pc-windows-msvc.exe`, sha256 sidecar is
          # `<asset>.sha256`. The travsr CLI builds the same name (issue #12).
          EXT=""
          case "${{ matrix.target }}" in *windows*) EXT=".exe" ;; esac

          # matrix.suffix is empty for the default assets, so their names are
          # unchanged — the CLI's derived name must keep resolving.
          BIN="${{ env.BINARY }}-${{ matrix.target }}${{ matrix.suffix }}${EXT}"
          cp "$TARGET_DIR/${{ env.BINARY }}${EXT}" "$OUTDIR/$BIN"

          # ORT's dynamic provider libraries, which copy-dylibs drops next to the
          # binary. The glob is `libonnxruntime*`, NOT `libonnxruntime.*`: the CUDA
          # providers are named libonnxruntime_providers_{shared,cuda}.so and the
          # dot-form glob silently missed all of them. `cp -L` because copy-dylibs
          # leaves symlinks on Linux and a symlink in a tarball is useless.
          # `ortlib/` is the verified DirectML runtime fetched above (load-dynamic
          # builds link nothing, so copy-dylibs leaves nothing in TARGET_DIR — the
          # library has to come from there instead).
          shopt -s nullglob
          LIBS=("$TARGET_DIR"/libonnxruntime* "$TARGET_DIR"/onnxruntime*.dll ortlib/*.dll)
          shopt -u nullglob

          # Guard: an unsuffixed asset is a DEFAULT asset and must contain no ORT
          # runtime at all. macOS is the one build with ORT compiled in and no
          # dylib, because its prebuilt links the core (and CoreML) statically —
          # so a dylib appearing here means that assumption broke and users would
          # get a binary that cannot find its runtime.
          if [ -z "${{ matrix.suffix }}" ] && [ ${#LIBS[@]} -gt 0 ]; then
            echo "::error::Default asset for ${{ matrix.target }} produced ORT runtime libraries:"
            printf '::error::  %s\n' "${LIBS[@]}"
            echo "::error::Default assets must be self-contained. Give this build a matrix suffix, or find out why static linking stopped applying."
            exit 1
          fi

          # Mirror guard: a load-dynamic build links no ONNX Runtime, so shipping
          # one without the library produces an artifact that quietly runs on CPU
          # forever — the backend declines, the resolver falls back to tract, and
          # nothing looks broken. A GPU artifact that is secretly a CPU artifact is
          # worse than a failed release, because nobody reports it.
          if [ -n "${{ matrix.ort_dll_pkg }}" ]; then
            case " ${LIBS[*]} " in
              *onnxruntime.dll*) : ;;
              *) echo "::error::${{ matrix.target }}${{ matrix.suffix }} is a load-dynamic build but no onnxruntime.dll was bundled — it would silently run on CPU."; exit 1 ;;
            esac
          fi

          for lib in "${LIBS[@]}"; do
            cp -L "$lib" "$OUTDIR/"
          done

          # SHA256 sidecars for the CLI integrity check — for every shipped file,
          # not just the binary: a tampered provider library is loaded into the
          # same process and is exactly as dangerous.
          cd "$OUTDIR"
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            if command -v sha256sum &>/dev/null; then
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            else
              shasum -a 256 "$f" | awk '{print $1}' > "$f.sha256"
            fi
          done
          ls -la

      # Cheap proof that the thing we are about to publish actually runs, and that
      # it resolved the engines we think we compiled. --capabilities loads no model
      # and creates no session, so it works on these GPU-less runners (and under
      # Rosetta for the x86_64 mac build).
      - name: Smoke-test the artifact
        shell: bash
        run: |
          EXT=""
          case "${{ matrix.target }}" in *windows*) EXT=".exe" ;; esac
          BIN="dist/${{ env.BINARY }}-${{ matrix.target }}${{ matrix.suffix }}${EXT}"

          # Only x86_64-apple-darwin gets the escape hatch: it is built on an arm64
          # runner and needs Rosetta to execute. Every other row runs natively
          # (aarch64 linux builds on ubuntu-22.04-arm), so for them a binary that
          # will not start IS the failure this step exists to catch — a `-cuda` or
          # `-directml` asset that cannot resolve its ONNX Runtime at load time
          # would otherwise print a warning and ship anyway.
          if ! "$BIN" --version; then
            if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
              echo "::warning::x86_64-darwin binary would not start on this arm64 runner (no Rosetta) — skipping smoke test."
              exit 0
            fi
            echo "::error::$BIN failed to start on its native runner. For an accelerated asset this usually means the bundled ONNX Runtime is missing or unloadable."
            exit 1
          fi

          CAPS="$("$BIN" --capabilities)"
          echo "capabilities: $CAPS"
          echo "$CAPS" | grep -q '"engines"' || { echo "::error::--capabilities did not report engines"; exit 1; }
          echo "$CAPS" | grep -q 'tract' || { echo "::error::tract must be registered in every build"; exit 1; }

          if [ -n "${{ matrix.features }}" ]; then
            echo "$CAPS" | grep -q '"universal_onnx":true' \
              || { echo "::error::${{ matrix.features }} build does not advertise universal ONNX support"; exit 1; }
            echo "$CAPS" | grep -q '"accelerated_compiled":true' \
              || { echo "::error::${{ matrix.features }} build does not report a compiled accelerator"; exit 1; }
          else
            echo "$CAPS" | grep -q '"universal_onnx":false' \
              || { echo "::error::default build must not claim ONNX support — it has no ORT compiled in"; exit 1; }
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # Suffix included or the -cuda upload collides with the default
          # x86_64-linux one (same target triple, different artifact).
          name: ${{ env.BINARY }}-${{ matrix.target }}${{ matrix.suffix }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
