name: Release

on:
  push:
    tags: ["v*"]

env:
  # Must match the Cargo [[bin]] name and the asset name the travsr CLI expects
  # (embed_catalog.toml binary_name = "travsr-embed").
  BINARY: travsr-embed
  # usearch 2.24.0 / simsimd compiles an AVX512-FP16 (Sapphire Rapids) x86 kernel
  # that needs gcc 12+; the ubuntu-22.04 runners ship gcc 11. Disable that one
  # target. f16 math is already software-pathed (SIMSIMD_NATIVE_F16=0), so there
  # is no functional loss. Harmless on aarch64 / macOS (the macro is x86-only).
  CFLAGS: "-DSIMSIMD_TARGET_SAPPHIRE=0"
  CXXFLAGS: "-DSIMSIMD_TARGET_SAPPHIRE=0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # travsr (sibling repo) is required for [patch.crates-io] path deps.
      # actions/checkout v4 requires the path to be inside the workspace root,
      # so we check out into travsr-sibling/ and rewrite the patch path in
      # Cargo.toml before building. This also works inside the cross Docker
      # container which only mounts the workspace, not its parent directory.
      - uses: actions/checkout@v4
        with:
          repository: Travsr-com/travsr
          path: travsr-sibling
          ref: master

      - name: Rewrite Cargo.toml patch paths for CI
        shell: bash
        # sed -i requires a backup suffix on BSD/macOS sed; .bak works on both GNU and BSD.
        run: sed -i.bak 's|path = "\.\./travsr/|path = "travsr-sibling/|g' Cargo.toml && rm -f Cargo.toml.bak

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux cross-compile)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Bundle binary + ORT dylib
        shell: bash
        run: |
          TARGET_DIR="target/${{ matrix.target }}/release"
          OUTDIR="dist"
          mkdir -p "$OUTDIR"

          BIN="${{ env.BINARY }}-${{ matrix.target }}"
          cp "$TARGET_DIR/${{ env.BINARY }}" "$OUTDIR/$BIN"

          # Bundle the ORT shared library (copy-dylibs placed it next to binary).
          for lib in "$TARGET_DIR"/libonnxruntime.*; do
            [ -f "$lib" ] && cp "$lib" "$OUTDIR/"
          done

          # SHA256 sidecar for CLI integrity check.
          cd "$OUTDIR"
          if command -v sha256sum &>/dev/null; then
            sha256sum "$BIN" | awk '{print $1}' > "$BIN.sha256"
          else
            shasum -a 256 "$BIN" | awk '{print $1}' > "$BIN.sha256"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}-${{ matrix.target }}
          path: dist/

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
