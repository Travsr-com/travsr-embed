[package]
name = "travsr-embed"
version = "1.1.0"
edition = "2021"
description = "Travsr embed sidecar — BGE family ONNX fp32, runtime model selection via --model-id"
license = "Apache-2.0"
rust-version = "1.91"

[[bin]]
name = "travsr-embed"
path = "src/main.rs"

[[bin]]
name = "bench-tract"
path = "src/bin/bench_tract.rs"

[dependencies]
# Published crates.io versions — patched below to local path while RFC-018
# changes are not yet in a crates.io release.
travsr-plugin-protocol = "0.7"
travsr-plugin-sdk      = "0.7"

# tract — pure-Rust ONNX inference (vectorized SIMD kernels for GeLU + matmul).
# BGE-small uses standard BERT (no RoPE), so tract can fully optimize it.
# Benchmark: ~140 nodes/sec single-thread, ~307 nodes/sec at 4 threads.
# Works identically on macOS (Apple Silicon) and OCI ARM64 with no flags.
tract-onnx = "0.23"

# HuggingFace fast tokenizer — loads tokenizer.json from disk.
tokenizers = "0.23"

# SQLite (bundled amalgamation — no system SQLite required).
rusqlite = { version = "0.32", features = ["bundled"] }

# usearch HNSW index — disk-persistent, mmap-loadable, incremental inserts.
# Pinned to 2.24.0 (the last release that uses the portable `simsimd` backend).
# usearch 2.25+ switched to `numkong`, whose AVX512-FP16 / AMX kernels require
# gcc 12+; the release runners use gcc 11 (ubuntu-22.04). With 2.24.0 the build
# only needs SIMSIMD_TARGET_SAPPHIRE=0 (set in CI) to skip the one fp16 x86
# kernel. See .github/workflows/release.yml and Cross.toml.
usearch = "=2.24.0"

dirs               = "5"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Per-model descriptor (model.toml) parsing — dim/pooling/prefix/inputs are
# config, never hardcoded. Written by the CLI from the catalog, read here.
serde = { version = "1", features = ["derive"] }
toml  = "0.8"

# OnnxRuntime — universal ONNX engine (issue #6). Optional: the default build
# compiles zero ORT code and registers only the tract factory. `download-binaries`
# (an ort default feature) fetches the per-target ONNX Runtime library at build
# time; CUDA/TensorRT additionally need the host CUDA 12 runtime + cuDNN.
ort = { version = "=2.0.0-rc.12", optional = true }

[features]
default = []                                          # tract only — byte-identical to today
# ORT with CPU execution only — the universal fallback engine for model
# families tract cannot run (ModernBERT, nomic-bert, …).
ort = ["dep:ort"]
# Hardware-accelerated execution providers (each implies the ORT CPU engine).
ort-coreml   = ["ort", "ort/coreml"]                  # macOS ANE+GPU, zero-install
ort-cuda     = ["ort", "ort/cuda"]                    # Linux/Win x86_64, needs CUDA 12 + cuDNN
ort-tensorrt = ["ort", "ort/tensorrt", "ort/cuda"]    # Linux/Win x86_64, needs TensorRT

# ── Local development override ────────────────────────────────────────────────
[patch.crates-io]
travsr-plugin-protocol = { path = "../travsr/crates/travsr-plugin-protocol" }
travsr-plugin-sdk      = { path = "../travsr/crates/travsr-plugin-sdk" }
