[package]
name = "travsr-embed"
version = "1.4.0"
edition = "2021"
description = "Travsr embed sidecar: BGE family ONNX fp32, runtime model selection via --model-id"
license = "Apache-2.0"
rust-version = "1.91"

[[bin]]
name = "travsr-embed"
path = "src/main.rs"

[[bin]]
name = "bench-tract"
path = "src/bin/bench_tract.rs"

# Offline text-to-vector tool for retrieval prototyping (#376). Reads/writes JSONL,
# touches no database or index.
[[bin]]
name = "embed-jsonl"
path = "src/bin/embed_jsonl.rs"

[dependencies]
# Published crates.io versions — patched below to local path while RFC-018
# changes are not yet in a crates.io release.
travsr-plugin-protocol = "0.7"
travsr-plugin-sdk      = "0.7"

# tract — pure-Rust ONNX inference (vectorized SIMD kernels for GeLU + matmul).
# BGE-small uses standard BERT (no RoPE), so tract can fully optimize it.
# Benchmark: ~140 nodes/sec single-thread, ~307 nodes/sec at 4 threads.
# Works identically on macOS (Apple Silicon) and OCI ARM64 with no flags.
tract-onnx = "0.23"

# HuggingFace fast tokenizer — loads tokenizer.json from disk.
tokenizers = "0.23"

# SQLite (bundled amalgamation — no system SQLite required).
rusqlite = { version = "0.32", features = ["bundled"] }

# usearch HNSW index — disk-persistent, mmap-loadable, incremental inserts.
# Pinned to 2.24.0 (the last release that uses the portable `simsimd` backend).
# usearch 2.25+ switched to `numkong`, whose AVX512-FP16 / AMX kernels require
# gcc 12+; the release runners use gcc 11 (ubuntu-22.04). With 2.24.0 the build
# only needs SIMSIMD_TARGET_SAPPHIRE=0 (set in CI) to skip the one fp16 x86
# kernel. See .github/workflows/release.yml and Cross.toml.
usearch = "=2.24.0"

dirs               = "5"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Per-model descriptor (model.toml) parsing — dim/pooling/prefix/inputs are
# config, never hardcoded. Written by the CLI from the catalog, read here.
serde = { version = "1", features = ["derive"] }
toml  = "0.8"

# `--capabilities` emits JSON for the travsr CLI's pre-flight model check
# (issue #6). Already in the tree transitively; named here because we depend on
# it directly now.
serde_json = "1"

# OnnxRuntime — universal ONNX engine (issue #6). Optional: the default build
# compiles zero ORT code and registers only the tract factory. `download-binaries`
# (an ort default feature) fetches the per-target ONNX Runtime library at build
# time; CUDA/TensorRT additionally need the host CUDA 12 runtime + cuDNN.
ort = { version = "=2.0.0-rc.12", optional = true }

[features]
default = []                                          # tract only — byte-identical to today
# ORT with CPU execution only — the universal fallback engine for model
# families tract cannot run (ModernBERT, nomic-bert, …).
ort = ["dep:ort"]
# Hardware-accelerated execution providers (each implies the ORT CPU engine).
#
# The EPs below link ONNX Runtime statically from ort's prebuilt distribution.
# That works on macOS and Linux and is preferred there: one self-contained
# binary, nothing to locate at run time.
#
# It does NOT work on Windows — see the `ort-*-dynamic` block below. ROCm,
# OpenVINO and XNNPACK have Cargo features upstream but no prebuilt for any
# target we ship, so they would need ONNX Runtime built from source; still out of
# scope (issue #6). OpenVINO is also the only route to an Intel NPU.
ort-coreml   = ["ort", "ort/coreml"]                  # macOS ANE+GPU, zero-install
ort-cuda     = ["ort", "ort/cuda"]                    # Linux/Win x86_64, needs CUDA + cuDNN on the host
ort-tensorrt = ["ort", "ort/tensorrt", "ort/cuda"]    # Linux/Win x86_64, needs TensorRT
ort-webgpu   = ["ort", "ort/webgpu"]                  # Linux x86_64 + macOS arm64; any GPU vendor; EXPERIMENTAL upstream

# ── Windows: dynamically loaded ONNX Runtime ──────────────────────────────────
# Windows cannot use the statically linked features above. `esaxx-rs` (via
# tokenizers) hardcodes the static CRT, so this crate must build /MT, while ort's
# prebuilt Windows libraries want the dynamic CRT — linking them together fails
# with LNK2019 on __imp_* symbols. That is not provider-specific: CPU-only ORT
# fails identically, because the unresolved symbols come from ONNX Runtime's own
# object code. CI measures all three (see ci.yml's Windows job).
#
# `load-dynamic` sidesteps it rather than solving it: nothing is linked at build
# time and `onnxruntime.dll` is loaded at run time, so the two CRTs never have to
# agree. Two consequences worth knowing:
#
#   1. The DLL must be present at run time. Windows searches the executable's own
#      directory first, so the copy release.yml ships beside the binary wins;
#      ORT_DYLIB_PATH overrides. Absent, the backend declines and the resolver
#      falls back to tract — slower, never broken.
#   2. We are no longer limited to ort's prebuilt set, because we supply the DLL.
#      That is what makes DirectML reachable: it has no ort prebuilt, but
#      Microsoft ships a DirectML-enabled onnxruntime.dll. DirectML drives ANY
#      DX12 adapter, so it is the one Windows path that serves Intel and AMD GPUs
#      rather than NVIDIA alone.
ort-dynamic  = ["ort", "ort/load-dynamic"]            # Windows ORT CPU; loads onnxruntime.dll at run time
ort-directml = ["ort-dynamic", "ort/directml"]        # Windows GPU, ANY vendor (Intel/AMD/NVIDIA) via DX12

# ── Local development override ────────────────────────────────────────────────
[patch.crates-io]
travsr-plugin-protocol = { path = "../travsr/crates/travsr-plugin-protocol" }
travsr-plugin-sdk      = { path = "../travsr/crates/travsr-plugin-sdk" }
